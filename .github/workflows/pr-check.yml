name: Private Office PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent-credentials]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Worker without production D1
        run: npm run build:test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: API contract suite
        run: npm run test:api
