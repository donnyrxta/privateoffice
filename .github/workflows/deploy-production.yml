name: Deploy Private Office production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-office-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || 'a6bc6b3e-2f9a-49d8-ae4a-e3515b57b61f' }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      PRIVATE_OFFICE_BUILD_SHA: ${{ github.sha }}
      PRODUCTION_BASE_URL: https://private-office.donny-gee.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require production deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CF_ACCESS_TEAM_DOMAIN" || { echo "::error::Missing CF_ACCESS_TEAM_DOMAIN repository variable"; exit 1; }
          test -n "$CF_ACCESS_AUD" || { echo "::error::Missing CF_ACCESS_AUD repository variable"; exit 1; }
          [[ "$CF_ACCESS_AUD" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::CF_ACCESS_AUD must be the 64-character Application Audience tag from the live Access application"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production Worker
        run: npm run build:cloudflare

      - name: TypeScript
        run: npx tsc --noEmit

      - name: API contract suite
        run: npm run test:api

      - name: Apply additive agent screening migrations
        run: |
          npx wrangler d1 execute private-office-d1 --remote --config dist/server/wrangler.json --file drizzle/0005_agent_onboarding_screening.sql
          npx wrangler d1 execute private-office-d1 --remote --config dist/server/wrangler.json --file drizzle/0006_agent_interviews.sql

          npx wrangler d1 execute private-office-d1 --remote --config dist/server/wrangler.json --file drizzle/0007_screening_location.sql

      - name: Deploy exact built artifact
        id: deploy
        run: npm run deploy:built

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Cloudflare edge propagation..."
          sleep 10
          for attempt in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_BASE_URL/api/health" || echo "000")
            if [ "$HTTP_CODE" = "000" ]; then
              echo "Attempt $attempt: health endpoint returned $HTTP_CODE (edge propagating), waiting..."
              sleep 10
              continue
            fi
            BODY=$(curl -sS --max-time 20 "$PRODUCTION_BASE_URL/api/health" || true)
            DEPLOYED_SHA=$(printf '%s' "$BODY" | node -e "
              let s = '';
              process.stdin.on('data', d => s += d).on('end', () => {
                try { process.stdout.write(JSON.parse(s).deployment?.git_sha || '') } catch {}
              });
            ")
            if [ "$DEPLOYED_SHA" = "$PRIVATE_OFFICE_BUILD_SHA" ]; then
              echo "Production is serving $DEPLOYED_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $PRIVATE_OFFICE_BUILD_SHA, got ${DEPLOYED_SHA:-<none>} (HTTP $HTTP_CODE)"
            sleep 10
          done
          echo "::error::Production did not converge to the Git revision that this workflow deployed"
          exit 1

      - name: Anonymous production contract
        run: npm run verify:production -- "$PRODUCTION_BASE_URL"

      - name: Install production browser verification
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Verify live buttons and sign-in navigation
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: node tests/production-browser.mjs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        with:
          name: production-browser-evidence
          path: outputs/production
          retention-days: 7
